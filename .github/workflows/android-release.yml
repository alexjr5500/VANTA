name: Android production release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed production APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/vanta-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          chmod 600 "$ANDROID_KEYSTORE_PATH"

      - name: Build signed release APK and App Bundle
        working-directory: android
        run: gradle --no-daemon --stacktrace -PvantaReleaseVersionCode="${GITHUB_RUN_NUMBER}" assembleRelease bundleRelease

      - name: Verify production artifacts and signing
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C
          shopt -s nullglob
          apks=(android/app/build/outputs/apk/release/*.apk)
          bundles=(android/app/build/outputs/bundle/release/*.aab)
          test "${#apks[@]}" -eq 1
          test "${#bundles[@]}" -eq 1
          apk="${apks[0]}"
          aab="${bundles[0]}"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          expected=$(keytool -J-Duser.language=en -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "${#expected}" -eq 64
          actual=$("$tools/apksigner" verify --print-certs "$apk" | awk '/Signer #1 certificate SHA-256 digest:/{print $NF; exit}' | tr '[:upper:]' '[:lower:]')
          test "$actual" = "$expected"
          badging=$("$tools/aapt" dump badging "$apk")
          grep -Fq "package: name='com.vanta.app' versionCode='$GITHUB_RUN_NUMBER'" <<< "$badging"
          if grep -q '^application-debuggable' <<< "$badging"; then exit 1; fi
          jarsigner -J-Duser.language=en -verify "$aab" | grep -Fq 'jar verified.'
          bundle_cert=$(keytool -J-Duser.language=en -printcert -jarfile "$aab" | awk '/SHA256:/{print $2; exit}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$bundle_cert" = "$expected"
          printf 'commit=%s\nrun=%s\nversionCode=%s\npackage=com.vanta.app\nsignerSha256=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_NUMBER" "$expected" > android/release-build-info.txt
          sha256sum "$apk" "$aab" > android/release-sha256.txt

      - name: Upload production APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: vanta-android-production
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/release-build-info.txt
            android/release-sha256.txt
          if-no-files-found: error
          retention-days: 14
