name: Android debug build

on:
  push:
    branches:
      - feat/unified-media-picker-vanta
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:
    inputs:
      preview_origin:
        description: "Optional HTTPS VANTA Vercel preview URL for APK device testing"
        required: false
        type: string

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Assemble Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Assemble debug APK
        working-directory: android
        env:
          # PR #288 must exercise its unmerged frontend, not the production URL.
          # Remove this branch-specific preview mapping before merging the PR.
          VANTA_DEBUG_ORIGIN: ${{ (github.event_name == 'workflow_dispatch' && inputs.preview_origin) || (github.event_name == 'pull_request' && github.head_ref == 'fix/android-status-picker-chat-layout-20261122' && 'https://vanta-git-fix-android-status-picker-chat-layo-2ddfde-vanta-73db.vercel.app') || '' }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ ((github.event_name == 'workflow_dispatch' && inputs.preview_origin != '') || (github.event_name == 'pull_request' && github.head_ref == 'fix/android-status-picker-chat-layout-20261122')) && 'vanta-android-preview-debug' || 'vanta-android-debug' }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
