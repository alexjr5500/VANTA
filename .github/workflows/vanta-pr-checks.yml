name: VANTA pull request checks

on:
  push:
    branches: [fix/moderation-removal-propagation-2026-11-15-compliance-base, fix/privacy-analytics-consent-enforcement]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint, tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace dependencies
        run: npm ci
      - name: Run frontend lint
        run: npm --prefix frontend run lint
      - name: Run frontend tests
        run: npm --prefix frontend run test
      - name: Build frontend for production
        run: npm --prefix frontend run build

  backend-tests:
    name: Backend security regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm --prefix backend install
      - name: Validate active Prisma schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/vanta_test?schema=public
        run: npx prisma validate
      - name: Generate Prisma Client from active schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/vanta_test?schema=public
        run: npx prisma generate
      - name: Verify bounded encrypted backup envelope
        run: node --test backend/scripts/backup-envelope.test.mjs backend/scripts/backup-r2-multipart.test.mjs backend/scripts/backup-run-policy.test.mjs

      - name: Run targeted backend security regression tests
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/vanta_test?schema=public
          JWT_SECRET: test-jwt-secret-long-enough-for-tests
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-long-enough-for-tests
          ENCRYPTION_KEY: test-encryption-key-for-ci-only-32-bytes
          ENCRYPTION_SALT: a1b2c3d4e5f60718293a4b5c6d7e8f90123456789abcdef0fedcba9876543210
        run: >
          npm --prefix backend run test -- --runInBand --forceExit --detectOpenHandles=false
          src/__tests__/security.rate-limiter.test.ts
          src/__tests__/security.admin-authorization.test.ts
          src/__tests__/auth.controller.session-security.test.ts
          src/__tests__/security.password-recovery.test.ts
          src/__tests__/security.session-manager.test.ts
          src/__tests__/security.encryption.test.ts
          src/__tests__/security.startup-config.test.ts
          src/__tests__/private-media.service.test.ts
          src/__tests__/private-media.controller.test.ts
          src/__tests__/chat.service.test.ts
          src/__tests__/upload.service.test.ts
          src/__tests__/chunk-upload.service.test.ts
          src/__tests__/reel-media-finalization.test.ts
          src/__tests__/fcm-provider-modular.test.ts
          src/__tests__/wallet.transfer-security.test.ts
          src/__tests__/wallet.withdrawal.test.ts
          src/__tests__/wallet.reconciliation.test.ts
          src/__tests__/monetization.earnings-ledger.test.ts
          src/__tests__/gift.service.test.ts
          src/__tests__/gift-catalog.test.ts
          src/__tests__/monetization.subscription-security.test.ts
          src/__tests__/security.fail-closed-prerequisites.test.ts
          src/__tests__/security.admin-session-2fa.test.ts
          src/__tests__/security.admin-rbac.test.ts
          src/__tests__/security.analytics-routes.test.ts
          src/__tests__/security.analytics-identity.test.ts
          src/__tests__/security.verification-admin-routes.test.ts
          src/__tests__/security.audit-log-hash.test.ts
          src/__tests__/wallet.service.test.ts
          src/__tests__/wallet.coin-purchase.test.ts
          src/__tests__/coin-purchase-no-bonus.test.ts
          src/__tests__/admin.finance-currency.test.ts
          src/__tests__/account-status.test.ts
          src/__tests__/call-session.service.test.ts
          src/__tests__/story.service.test.ts
          src/__tests__/status-expiry.service.test.ts
          src/__tests__/live.service.test.ts
          src/__tests__/compliance.active-schema.test.ts
          src/__tests__/content-removal.service.test.ts
          src/__tests__/privacy-permissions.test.ts
          src/__tests__/user.service.test.ts
          src/__tests__/group-ownership.test.ts
          src/__tests__/channel-ownership.test.ts src/__tests__/community-settings.test.ts src/__tests__/community-insights.test.ts
          src/__tests__/feed.moderation-guards.test.ts
          src/__tests__/feed-read-optimization.test.ts
          src/__tests__/feed.video-publication.test.ts
          src/__tests__/replyAudience.test.ts
          src/__tests__/post.service.test.ts
          src/ai/__tests__/privacy.middleware.test.ts

      - name: Install media verification tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version
          ffprobe -version
      - name: Verify actual Status video media
        env:
          RUN_STATUS_MEDIA_INTEGRATION: '1'
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/vanta_test?schema=public
          JWT_SECRET: test-jwt-secret-long-enough-for-tests
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-long-enough-for-tests
        run: npm --prefix backend run test -- --runInBand src/__tests__/status-video-media.integration.test.ts

  backend-build:
    name: Backend TypeScript production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm --prefix backend install
      - name: Validate active Prisma schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/vanta_test?schema=public
        run: npx prisma validate
      - name: Generate Prisma Client from active schema
        working-directory: backend
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/vanta_test?schema=public
        run: npx prisma generate
      - name: Build backend
        run: npm --prefix backend run build

  durable-queue-postgres:
    name: Durable queue PostgreSQL integration and concurrency
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vanta_queue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d vanta_queue_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm --prefix backend install
      - name: Run PostgreSQL integration and concurrency tests
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/vanta_queue_test
          VANTA_CI_MAINTENANCE_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/vanta_queue_test
          VANTA_CI_SHARDING_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/vanta_queue_test
        run: npm --prefix backend run test -- --runInBand src/__tests__/durable-queue.postgres.integration.test.ts src/__tests__/database-replica.postgres.integration.test.ts src/__tests__/distributed-maintenance.postgres.integration.test.ts src/__tests__/sharding-assessment.postgres.integration.test.ts
      - name: Verify approved gift catalog migration and historical records
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/vanta_queue_test
        run: node backend/scripts/verify-reference-gift-migration.cjs

  durable-media:
    name: Durable media handlers and real FFmpeg integration
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm --prefix backend install
      - name: Install FFmpeg for real video integration
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Verify FFmpeg exists
        run: ffmpeg -version
      - name: Verify Sharp native runtime loads
        run: cd backend && node -e "const sharp = require('sharp'); console.log('Sharp', sharp.versions.sharp);"
      - name: Run durable media and queue unit tests
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/vanta_test?schema=public
        run: >
          npm --prefix backend run test -- --runInBand
          src/__tests__/media-hls.ffmpeg.integration.test.ts
          src/__tests__/media-operations.test.ts
          src/__tests__/media-thumbnail-job.test.ts
          src/__tests__/media-storage-readiness.test.ts
          src/__tests__/media-storage-audit.test.ts
          src/__tests__/cloudinary-storage-config.test.ts
          src/__tests__/cloudinary-media-job.test.ts
          src/__tests__/cloudinary-hls-acceptance.test.ts
          src/__tests__/cloudinary-media-producer.test.ts
          src/__tests__/cloudinary-media-categories.test.ts
          src/__tests__/durable-media-job-routing.test.ts
          src/__tests__/reel-hls-mapping.test.ts
          src/__tests__/storage-diagnostics.test.ts
          src/__tests__/durable-media-handlers.test.ts
          src/__tests__/durable-queue.repository.test.ts
          src/__tests__/durable-worker-shutdown.test.ts
          src/__tests__/durable-queue.health.test.ts
          src/__tests__/durable-queue.alerts.test.ts
          src/__tests__/durable-queue.worker.test.ts
          src/__tests__/cache.local.test.ts
          src/__tests__/database-pool-readiness.test.ts
          src/__tests__/server-lifecycle.test.ts
          src/__tests__/multi-replica-http.integration.test.ts
          src/__tests__/realtime-presence.test.ts
          src/__tests__/http-telemetry.test.ts
          src/__tests__/dependency-telemetry.test.ts
          src/__tests__/alert-delivery.test.ts

  redis-cache:
    name: Redis cache adapter integration
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install backend dependencies
        run: npm --prefix backend install
      - name: Run isolated Redis integration tests
        env:
          VANTA_REDIS_CACHE_ENABLED: "true"
          REDIS_URL: redis://127.0.0.1:6379
          VANTA_CI_REDIS_URL: redis://127.0.0.1:6379
        run: npm --prefix backend run test -- --runInBand src/__tests__/cache.redis.integration.test.ts
      - name: Verify shared cache behavior across independent clients
        env:
          VANTA_REDIS_CACHE_ENABLED: "true"
          VANTA_REDIS_CACHE_SHARED_ONLY: "true"
          REDIS_URL: redis://127.0.0.1:6379
          VANTA_CI_REDIS_URL: redis://127.0.0.1:6379
        run: npm --prefix backend run test -- --runInBand src/__tests__/cache.shared.redis.integration.test.ts
      - name: Verify cross-server Socket.IO delivery
        env:
          VANTA_CI_REDIS_URL: redis://127.0.0.1:6379
        run: npm --prefix backend run test -- --runInBand src/__tests__/realtime-redis.integration.test.ts

  staging-load-harness:
    name: Staging load harness safety tests (no external traffic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test backend/scripts/staging-load-test.test.mjs backend/scripts/evaluate-performance.test.mjs backend/scripts/acceptance-preflight.test.mjs backend/scripts/acceptance-migrate.test.mjs backend/scripts/acceptance-provider-probe.test.mjs

  database-streaming-replication:
    name: Disposable PostgreSQL streaming replica and fenced failover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix backend install
      - name: Verify real streaming standby and fenced promotion
        env:
          VANTA_CI_DISPOSABLE_REPLICATION: "yes"
        run: bash backend/scripts/ci-streaming-replication.sh

  database-backup-restore:
    name: Disposable VANTA schema backup and media restore
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm --prefix backend install
      - name: Install age encryption tool
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Verify streaming public-key backup encryption
        run: bash backend/scripts/ci-backup-age.sh
      - name: Verify hard encrypted capture byte limits and failure cleanup
        run: node --test backend/scripts/backup-bounded-capture.test.mjs
      - name: Exercise isolated database and media recovery
        env:
          VANTA_CI_DISPOSABLE_RESTORE: "yes"
        run: bash backend/scripts/ci-backup-restore.sh
