name: Android native compile check

on:
  push:
    branches:
      - fix/status-inline-android-gallery
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-compile-check.yml'
      - '.github/workflows/android-release.yml'

permissions:
  contents: read

jobs:
  android-compile:
    name: Compile Android production Kotlin and resources
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      # Ubuntu runners already ship Android SDK command line tools. Avoid the
      # setup-android action's obsolete "sdkmanager tools" package request.
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compile release Kotlin and Android resources
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:compileReleaseKotlin :app:processReleaseResources

  release-artifact-acceptance:
    name: Verify signed APK and AAB with disposable test key
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/vanta-ci-disposable-signing.p12
      ANDROID_KEYSTORE_PASSWORD: vanta-ci-disposable-only
      ANDROID_KEY_ALIAS: vanta-ci-test
      ANDROID_KEY_PASSWORD: vanta-ci-disposable-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find /usr/local/lib/android/sdk/cmdline-tools -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Create disposable CI-only signing key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keytool -genkeypair -storetype PKCS12 -keystore "$ANDROID_KEYSTORE_PATH" -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD -alias "$ANDROID_KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 2 -dname "CN=VANTA CI disposable test key"
      - name: Assemble release variants (not distributable)
        working-directory: android
        run: gradle --no-daemon --stacktrace -PvantaReleaseVersionCode=4242 assembleRelease bundleRelease
      - name: Verify release artifact identities and signatures
        shell: bash
        run: |
          bash android/scripts/verify-release-artifacts.sh 4242
          sha256sum -c android/release-sha256.txt
          if bash android/scripts/verify-release-artifacts.sh 4243; then
            echo "ERROR: wrong version code was accepted"
            exit 1
          fi
      - name: Destroy disposable signing key and local artifacts
        if: always()
        shell: bash
        run: |
          rm -f -- "$ANDROID_KEYSTORE_PATH" android/release-build-info.txt android/release-sha256.txt
          rm -rf -- android/app/build/outputs/apk/release android/app/build/outputs/bundle/release
